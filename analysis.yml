# gitlab-ci-template/analysis.yml

.analysis:
  image: docker
  services:
    - docker:dind
  script:
    - echo "Starting analysis for app"

    - BIN_NAME="$(basename "$BINARY_FILE_PATH")"
    - RESULTS_MOUNT="$CI_PROJECT_DIR/$RESULTS_DIR"
    - >
      docker create
      --name kryptowire_analysis
      -v "$RESULTS_MOUNT:/usr/src/app/$RESULTS_DIR"
      -e MAST_REST_API="$MAST_REST_API"
      -e MAST_REST_API_KEY="$MAST_REST_API_KEY"
      -e SCORE_THRESHOLD="$SCORE_THRESHOLD"
      -e MAX_ANALYSIS_TIME="$MAX_ANALYSIS_TIME"
      -e BINARY_FILE_PATH="$BIN_NAME"
      -e RESULTS_DIR="$RESULTS_DIR"
      kryptowireowner/gitlab-ci:"$VERSION"
      npm start

    - docker cp "$BINARY_FILE_PATH" "kryptowire_analysis:/usr/src/app/$BIN_NAME"

    - docker start kryptowire_analysis -a

    - echo "Analysis done!"
  artifacts:
    reports:
      dast: $RESULTS_DIR/gl-dast-report.json
  rules:
    - if: $VERSION == null
      variables:
        VERSION: "latest"
    - if: $VERSION != null
